<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa0a6"/>
    </marker>
    <marker id="flecheO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6a13"/>
    </marker>
  </defs>
  <rect width="960" height="270" rx="16" fill="#14171c"/>
  <text x="24" y="36" font-size="15" font-weight="600" fill="#9aa0a6" letter-spacing="2">LE CYCLE D'UNE MANCHE</text>

  <g text-anchor="middle" font-size="13" fill="#c9cdd2">
    <rect x="20" y="56" width="165" height="104" rx="10" fill="#1f242b" stroke="#2f3640"/>
    <text x="102" y="86" font-size="16" font-weight="700" fill="#f2f2f2">ATTENTE</text>
    <text x="102" y="112">serveur vide</text>
    <text x="102" y="132">1er joueur → ville au hasard</text>

    <rect x="205" y="56" width="165" height="104" rx="10" fill="#2a1a10" stroke="#ff6a13"/>
    <text x="287" y="86" font-size="16" font-weight="700" fill="#ff6a13">EN COURS</text>
    <text x="287" y="110" font-size="20" font-weight="700" fill="#f2f2f2">15:00</text>
    <text x="287" y="134">combat dans la ville</text>

    <rect x="390" y="56" width="165" height="104" rx="10" fill="#1f242b" stroke="#2f3640"/>
    <text x="472" y="86" font-size="16" font-weight="700" fill="#f2f2f2">FIN · 10 s</text>
    <text x="472" y="112">vainqueur, podium,</text>
    <text x="472" y="132">tous au lobby</text>

    <rect x="575" y="56" width="165" height="104" rx="10" fill="#1f242b" stroke="#2f3640"/>
    <text x="657" y="86" font-size="16" font-weight="700" fill="#f2f2f2">VOTE · 15 s</text>
    <text x="657" y="112">3 villes proposées,</text>
    <text x="657" y="132">nettoyage de la ville</text>

    <rect x="760" y="56" width="165" height="104" rx="10" fill="#1f242b" stroke="#2f3640"/>
    <text x="842" y="86" font-size="16" font-weight="700" fill="#f2f2f2">DÉPART · 5 s</text>
    <text x="842" y="112">météo, portes ouvertes,</text>
    <text x="842" y="132">joueurs figés : 3, 2, 1</text>
  </g>

  <g stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#fleche)">
    <line x1="187" y1="108" x2="202" y2="108"/>
    <line x1="372" y1="108" x2="387" y2="108"/>
    <line x1="557" y1="108" x2="572" y2="108"/>
    <line x1="742" y1="108" x2="757" y2="108"/>
  </g>

  <path d="M842 162 V214 H287 V165" stroke="#ff6a13" stroke-width="2" fill="none" marker-end="url(#flecheO)"/>
  <text x="565" y="206" font-size="14" font-weight="600" fill="#ff6a13" text-anchor="middle">GO ! nouvelle manche dans une autre ville</text>
  <text x="565" y="246" font-size="12" fill="#9aa0a6" text-anchor="middle">Durées par défaut, toutes réglables dans reglages.json · déploiement fermé dans les 30 dernières secondes (on part avec la manche suivante)</text>
</svg>
